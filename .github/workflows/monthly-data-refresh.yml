name: Monthly Data Refresh

# Extend common backtest panels + BTC observation sample monthly.
# Not Decision / not strategy refit.

on:
  schedule:
    # 1st of each month 00:30 UTC (after BTC-only job window if any)
    - cron: "30 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-data-refresh
  cancel-in-progress: false

jobs:
  common_and_btc:
    name: Common backtest + BTC observation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance matplotlib

      - name: Common backtest monthly refresh
        run: python scripts/common_backtest/run_monthly_refresh.py

      - name: BTC Observation Refresh
        run: python research/btc_dca_halving/run_observation_refresh.py --force
        # --force: same calendar day may already have obs dirs from a prior manual run

      - name: Commit artifacts
        run: |
          set -euo pipefail
          git config user.name "monthly-data-bot"
          git config user.email "monthly-data-bot@users.noreply.github.com"
          git add \
            data/common_backtest \
            data/backtest/raw \
            research/bitcoin_panel.csv \
            research/bitcoin_metrics.json \
            research/figures \
            research/btc_dca_halving \
            docs/reports/BTC-COMPLETE-A1-DESCRIPTIVE-STATISTICS-001.md \
            docs/reports/BTC-COMPLETE-C-FIXED-APPLICATION-001.md \
            docs/reports/BTC-COMPLETE-D-DIFFERENCE-EXPLANATION-001.md \
            || true
          if git diff --cached --quiet; then
            echo "No data artifacts to commit."
            exit 0
          fi
          DAY="$(date -u +%Y-%m-%d)"
          git commit -m "chore(data): monthly refresh ${DAY}"
          git push
