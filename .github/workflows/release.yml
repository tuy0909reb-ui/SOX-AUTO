name: Release

# Phase5-4 Release Automation (minimal) — required input for Phase6-1 Deploy
# Spec: docs/specs/release_automation_phase5_4.md
# Does not deploy. Does not modify tools/secretary/ source contents.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (e.g. 1.0.0). Ignored when triggered by tag.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release + artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version / tag
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            RAW="${{ github.event.inputs.version }}"
            if [[ -z "$RAW" ]]; then
              echo "version input required for workflow_dispatch"
              exit 1
            fi
            RAW="${RAW#v}"
            TAG="v${RAW}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid tag/version: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts (source + docs bundle)
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          echo "$VERSION" > dist/VERSION

          # Source archive — content copied as-is (no transform).
          INCLUDE=(tools/secretary docs/specs)
          if [[ -f README.md ]]; then
            INCLUDE+=(README.md)
          fi
          tar -czf "dist/source-${TAG}.tar.gz" \
            --exclude=.git \
            --exclude=dist \
            --exclude=.env \
            "${INCLUDE[@]}"

          # Documentation bundle
          tar -czf "dist/docs-${TAG}.tar.gz" docs/

          # Package metadata (not a mutation of app logic)
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit=${GITHUB_SHA}"
          } > "dist/package-${TAG}.txt"

          ls -la dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git tag "$TAG" "${GITHUB_SHA}"
              git push origin "refs/tags/$TAG"
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Release $TAG" \
              --notes "Automated release for $TAG (version $VERSION). Artifacts are unmodified source/docs bundles."
          fi
